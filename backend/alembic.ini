# Alembic configuration. See docs/CONTRACT.md section 5.
# The connection string is intentionally NOT hard-coded here: sqlalchemy.url is left
# empty and filled in at runtime by alembic/env.py from settings.DATABASE_URL, so the
# same config works for both SQLite and MySQL.

[alembic]
# Migration scripts directory, relative to this file (backend/)
script_location = alembic

# Paths prepended to sys.path so `app` is importable when running from backend/
prepend_sys_path = .

# Migration file name pattern: timestamp + revision + slug, avoids name clashes
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Left empty on purpose; env.py sets it dynamically
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured for now.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
